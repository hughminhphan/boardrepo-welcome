<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GitHub for Electronics | BoardRepo</title>
<meta name="description" content="Sign up to access 9,698 open-source PCB designs.">
<meta name="theme-color" content="#FAF9F6">
<style>
  @font-face { font-family: "BoardRepo Display"; src: url(fonts/BoardRepoDisplay-Inter-800.woff2) format("woff2"); font-weight: 800; font-display: swap; }
  @font-face { font-family: "Inter"; src: url(fonts/Inter-400.woff2) format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Inter"; src: url(fonts/Inter-500.woff2) format("woff2"); font-weight: 500; font-display: swap; }
  @font-face { font-family: "Inter"; src: url(fonts/Inter-600.woff2) format("woff2"); font-weight: 600; font-display: swap; }
  @font-face { font-family: "Inter"; src: url(fonts/Inter-700.woff2) format("woff2"); font-weight: 700; font-display: swap; }
  @font-face { font-family: "IBM Plex Mono"; src: url(fonts/IBMPlexMono-500.woff2) format("woff2"); font-weight: 500; font-display: swap; }

  /* boardrepo.com landing tokens */
  :root {
    --lp-paper: #FAF9F6;
    --lp-forest: #06251B;
    --lp-mask: #51AD4C;
    --lp-green-ink: #277536;
    --lp-muted: #687271;
    --lp-rule: #E5E7E0;
    --lp-cta-hover: #124331;
    --lp-display: "BoardRepo Display", Inter, Arial, sans-serif;
    --lp-body: Inter, Arial, sans-serif;
    --lp-mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  html { background: var(--lp-paper); }
  body {
    min-height: 100svh;
    font-family: var(--lp-body);
    color: var(--lp-forest);
    background: var(--lp-paper);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  header {
    height: 64px; padding: 0 20px;
    display: flex; align-items: center;
    border-bottom: 1px solid var(--lp-rule);
  }
  .brand { display: inline-flex; align-items: center; gap: 10px; color: var(--lp-forest); text-decoration: none; }
  .brand img { width: 28px; height: 28px; display: block; }
  .brand span { font-weight: 700; font-size: 21px; letter-spacing: -0.01em; }

  .page { display: grid; }
  .copy { padding: 36px 20px 0; }

  .eyebrow {
    color: var(--lp-green-ink);
    font-size: 12px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; line-height: 1.5;
    margin-bottom: 14px;
  }
  h1 {
    font-family: var(--lp-display); font-weight: 800;
    font-size: 46px; line-height: 1.04; letter-spacing: -0.055em;
    text-wrap: balance;
  }
  .sub { margin-top: 14px; font-size: 17px; line-height: 1.4; color: var(--lp-muted); max-width: 32ch; }
  .sub b { font-weight: 600; color: var(--lp-forest); font-variant-numeric: tabular-nums; }

  .typer { margin-top: 18px; font-size: 20px; line-height: 1.25; font-weight: 700; letter-spacing: -0.015em; white-space: nowrap; }
  .typer .word { color: var(--lp-green-ink); }
  .caret { display: inline-block; width: 2px; height: 1.05em; margin-left: 2px; vertical-align: -0.17em; background: var(--lp-green-ink); }
  .caret.blink { animation: blink 1.06s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .cta { margin-top: 24px; display: grid; gap: 10px; }
  .btn {
    height: 52px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    font: 600 16px/1 var(--lp-body); text-decoration: none;
    color: var(--lp-forest); background: #fff; border: 1px solid var(--lp-rule);
    transition: background-color .15s cubic-bezier(.25,1,.5,1), border-color .15s cubic-bezier(.25,1,.5,1);
  }
  .btn svg { width: 20px; height: 20px; flex: none; }
  .btn:hover { border-color: #C9CEC4; }
  .btn.primary { background: var(--lp-forest); color: var(--lp-paper); border-color: var(--lp-forest); }
  .btn.primary:hover { background: var(--lp-cta-hover); }
  .note { margin-top: 12px; font-size: 13px; color: var(--lp-muted); text-align: center; }

  /* Phone: the board band. Their trace-and-via art, real boards drifting across it. */
  .art {
    position: relative; margin-top: 28px; height: 300px;
    border-radius: 28px 28px 0 0; overflow: hidden;
    background: var(--lp-mask);
  }
  .art::before { content: ""; position: absolute; inset: 0; background: url(cream-grain.webp) 0 0 / 300px auto; mix-blend-mode: multiply; opacity: .55; pointer-events: none; }
  .rail { position: absolute; inset: 0; display: flex; align-items: center; }
  .track { display: flex; gap: 36px; padding-left: 36px; width: max-content; animation: drift 90s linear infinite; }
  .rail:active .track { animation-play-state: paused; }
  @keyframes drift { to { transform: translateX(-50%); } }
  .board { width: 220px; flex: none; text-align: center; }
  .board img { width: 100%; height: 150px; object-fit: contain; display: block; filter: drop-shadow(0 14px 22px rgba(6,37,27,.38)); }
  .board:nth-child(odd) img { transform: rotate(-6deg); }
  .board:nth-child(even) img { transform: rotate(5deg); }
  .board .name { margin-top: 14px; font: 500 12px/1.3 var(--lp-mono); color: var(--lp-forest); white-space: nowrap; }
  .stack { display: none; }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* Editorial pass (rhythm, display-face typer, home-page proportions) */
  header { height: 72px; }
  .brand img { width: 32px; height: 32px; }
  .brand span { font-size: 26px; letter-spacing: -0.02em; }
  .copy { padding-top: 44px; }
  .sub { margin-top: 16px; }
  .typer { font-family: var(--lp-display); font-weight: 800; font-size: 26px; letter-spacing: -0.045em; margin-top: 28px; }
  .cta { margin-top: 16px; }
  .btn { border-radius: 14px; }
  .note { text-align: left; margin-top: 14px; }
  .art { background: var(--lp-mask) url(circuit-hero-green.webp) 100% 0 / auto 560px no-repeat; border-radius: 0; margin-top: 32px; height: 320px; }
  .art::before { display: none; }
  .board:nth-child(odd) img { transform: rotate(-3deg); }
  .board:nth-child(even) img { transform: rotate(2deg); }

  /* Desktop: their home hero. Copy left, the trace art bleeding off the right. */
  @media (min-width: 960px) {
    header { height: 88px; padding: 0 72px; }
    .brand img { width: 40px; height: 40px; }
    .brand span { font-size: 34px; }
    .page { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); min-height: calc(100svh - 88px); }
    .copy { padding: 0 40px 0 72px; align-self: center; max-width: 680px; }
    .eyebrow { margin-bottom: 20px; }
    h1 { font-size: clamp(64px, 6vw, 96px); line-height: 1.04; }
    .sub { margin-top: 22px; font-size: 22px; }
    .typer { margin-top: 24px; font-size: 28px; }
    .cta { margin-top: 36px; width: 400px; }
    .note { text-align: left; }
    .art {
      margin: 0; height: auto; border-radius: 0;
      background: url(circuit-hero-green.webp) 78% 50% / cover no-repeat;
    }
    .art::before { display: none; }
    .rail { display: none; }
    .stack { display: block; position: absolute; inset: 0; }
    .stack .board { position: absolute; width: auto; }
    .stack .board img { height: auto; }
    .stack .b1 { width: 440px; left: 27%; top: 9%; }
    .stack .b1 img { transform: rotate(-5deg); }
    .stack .b2 { width: 300px; left: 19%; top: 60%; }
    .stack .b2 img { transform: rotate(4deg); }
    .stack .b3 { width: 250px; left: 61%; top: 56%; }
    .typer { font-size: 34px; margin-top: 32px; }
    .cta { margin-top: 20px; }
    .stack .b3 img { transform: rotate(-4deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .track { animation: none; }
    .caret.blink { animation: none; }
  }
</style>
</head>
<body>
  <header>
    <a class="brand" href="https://boardrepo.com/?ref=hugh" aria-label="BoardRepo">
      <img src="boardrepo-mark.svg" alt=""><span>BoardRepo</span>
    </a>
  </header>

  <div class="page">
    <main class="copy">
      <h1 id="title">GitHub for Electronics</h1>
      <p class="sub" id="sub">Sign up to access <b data-public-boards>9,698</b> open-source PCB designs.</p>

      <p class="typer" aria-hidden="true"><span id="prefix">Design with</span> <span class="word" id="word"></span><span class="caret blink" id="caret"></span></p>
      <p class="sr" id="sr"></p>

      <div class="cta">
        <a class="btn primary" href="https://boardrepo.com/auth/github/start?ref=hugh">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.52-1.33-1.28-1.69-1.28-1.69-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.41-2.69 5.38-5.26 5.67.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5Z"/></svg>
          <span id="btn-github">Continue with GitHub</span>
        </a>
        <a class="btn" href="https://boardrepo.com/auth/google/start?ref=hugh">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.5 12.27c0-.85-.08-1.67-.22-2.45H12v4.63h6.45a5.5 5.5 0 0 1-2.39 3.62v3h3.87c2.26-2.09 3.57-5.17 3.57-8.8Z"/><path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.94-2.91l-3.87-3c-1.07.72-2.45 1.15-4.07 1.15-3.13 0-5.78-2.11-6.73-4.95h-4v3.1A12 12 0 0 0 12 24Z"/><path fill="#FBBC05" d="M5.27 14.29a7.2 7.2 0 0 1 0-4.58v-3.1h-4a12 12 0 0 0 0 10.78l4-3.1Z"/><path fill="#EA4335" d="M12 4.77c1.76 0 3.34.61 4.59 1.8l3.43-3.43A11.5 11.5 0 0 0 12 0 12 12 0 0 0 1.27 6.61l4 3.1C6.22 6.88 8.87 4.77 12 4.77Z"/></svg>
          <span id="btn-google">Continue with Google</span>
        </a>
        <a class="btn" href="https://boardrepo.com/signin?ref=hugh">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg>
          <span id="btn-email">Continue with email</span>
        </a>
      </div>
      <p class="note" id="note">New here? Signing in creates your account.</p>
    </main>

    <section class="art" aria-label="Boards in the library">
      <div class="rail"><div class="track" id="track"></div></div>
      <div class="stack" id="stack"></div>
    </section>
  </div>

<script>
  // Real public boards on boardrepo.com: [owner, slug, render file id from /api/files].
  const BOARDS = [
    ["greatscottgadgets", "hackrf", "50e81e7b-61c3-4a12-ad8c-9a1a09e624de"],
    ["torvalds", "guitarpedal", "c68b704d-ecc4-4975-a016-853c841eb95f"],
    ["glasgowembedded", "glasgow", "5fbb9d3f-d6d4-46a5-abee-7b65da8efed3"],
    ["scottbez1", "smartknob", "2e71f7dd-616c-4c1e-8d32-43ac2b6e5cb4"],
    ["joeycastillo", "the-open-book", "a6cf5269-9790-4d00-9c2a-c394d7bc8075"],
    ["hrvach", "deskhop", "5a5e75ec-a4a1-410a-a279-ebe40d4f58c5"],
    ["usbarmory", "usbarmory", "c68e90ae-213c-4e0a-abaa-ca1702020462"],
    ["foostan", "crkbd", "cec2e15d-a152-43de-b79f-31f605e48c6d"],
    ["stack-chan", "stack-chan", "54b6cfbb-02aa-4ecd-873c-ecc8af709925"],
    ["system76", "launch", "b781875e-4aa6-4fc6-bd81-d9e16a360995"],
    ["modos-labs", "glider", "4b0f022c-31fe-43b1-9e3a-e766726b52ee"],
    ["scottbez1-2", "splitflap", "6ee87dd7-8e7c-4a99-a675-1f2e6a5aeae2"],
  ];
  const FILES = "https://boardrepo.com/api/files/";   // on boardrepo.com itself: "/api/files/"
  const board = ([owner, slug, id], cls = "", hidden = false) =>
    `<figure class="board ${cls}"${hidden ? ' aria-hidden="true"' : ""}>` +
    `<img src="${FILES}${id}?view=1" alt="${hidden ? "" : `${slug} by ${owner}`}" loading="lazy" decoding="async">` +
    `<figcaption class="name">${owner}/${slug}</figcaption></figure>`;
  // Phone: two copies so the drift loops without a seam.
  document.getElementById("track").innerHTML =
    BOARDS.map(b => board(b)).join("") + BOARDS.map(b => board(b, "", true)).join("");
  // Desktop: three boards resting on the art.
  document.getElementById("stack").innerHTML =
    [board(BOARDS[0], "b1", true), board(BOARDS[2], "b2", true), board(BOARDS[1], "b3", true)].join("");

  // "Design with ___": each word types on, holds, then backspaces to the next.
  const WORDS = ["references", "confidence", "speed", "a team", "a change log"];
  const word = document.getElementById("word");
  const caret = document.getElementById("caret");
  const prefix = document.getElementById("prefix").textContent;
  document.getElementById("sr").textContent =
    `${prefix} ${WORDS.slice(0, -1).join(", ")} and ${WORDS.at(-1)}.`;
  word.textContent = WORDS[0];
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  (async () => {
    let i = 0;
    if (reduce) { for (;;) { await wait(2200); i = (i + 1) % WORDS.length; word.textContent = WORDS[i]; } }
    await wait(1800);
    for (;;) {
      caret.classList.remove("blink");
      for (let n = word.textContent.length; n > 0; n--) { word.textContent = word.textContent.slice(0, n - 1); await wait(28); }
      await wait(180);
      i = (i + 1) % WORDS.length;
      const w = WORDS[i];
      for (let n = 1; n <= w.length; n++) { word.textContent = w.slice(0, n); await wait(w[n - 1] === " " ? 110 : 52 + Math.random() * 34); }
      caret.classList.add("blink");
      await wait(1700);
    }
  })();
</script>
</body>
</html>
