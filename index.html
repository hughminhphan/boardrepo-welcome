<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GitHub for Electronics | BoardRepo</title>
<meta name="description" content="Sign up to access 9,697 open-source PCB designs.">
<meta name="theme-color" content="#0D1B15">
<style>
  @font-face { font-family: "BR Display"; src: url(fonts/BoardRepoDisplay-Inter-800.woff2) format("woff2"); font-weight: 800; font-display: swap; }
  @font-face { font-family: "Inter"; src: url(fonts/Inter-400.woff2) format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Inter"; src: url(fonts/Inter-500.woff2) format("woff2"); font-weight: 500; font-display: swap; }
  @font-face { font-family: "Inter"; src: url(fonts/Inter-600.woff2) format("woff2"); font-weight: 600; font-display: swap; }
  @font-face { font-family: "Inter"; src: url(fonts/Inter-700.woff2) format("woff2"); font-weight: 700; font-display: swap; }
  @font-face { font-family: "Plex Mono"; src: url(fonts/IBMPlexMono-500.woff2) format("woff2"); font-weight: 500; font-display: swap; }
  @font-face { font-family: "Plex Mono"; src: url(fonts/IBMPlexMono-600.woff2) format("woff2"); font-weight: 600; font-display: swap; }

  :root {
    --page: #0D1B15;
    --surface: #16251C;
    --plate: #203326;
    --rule: #304335;
    --paper: #FAF9F6;
    --forest: #06251B;
    --mask: #51AD4C;
    --green: #8CD082;
    --muted: #B4BEB4;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: var(--page); color: var(--paper); }
  body {
    font-family: Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100svh;
    background:
      radial-gradient(120% 60% at 50% 0%, #1A3526 0%, transparent 60%),
      url(forest-grain.webp) center / 512px auto,
      var(--page);
    background-blend-mode: normal, soft-light, normal;
    overflow-x: hidden;
  }

  .wrap { width: 100%; max-width: 560px; margin: 0 auto; padding: 0 20px; }

  header { padding: 18px 0 0; }
  .brand { display: inline-flex; align-items: center; gap: 9px; color: var(--paper); text-decoration: none; }
  .brand img { width: 26px; height: 26px; display: block; }
  .brand span { font-weight: 700; font-size: 17px; letter-spacing: -0.01em; }

  main { padding: 44px 0 0; }

  h1 {
    font-family: "BR Display", Inter, sans-serif;
    font-weight: 800;
    font-size: clamp(44px, 12.4vw, 68px);
    line-height: 1.02;
    letter-spacing: -0.055em;
    text-wrap: balance;
  }

  .sub {
    margin-top: 18px;
    font-size: 19px;
    line-height: 1.4;
    font-weight: 500;
    color: var(--muted);
    max-width: 30ch;
  }
  .sub b {
    font-family: "Plex Mono", ui-monospace, monospace;
    font-weight: 600;
    color: var(--paper);
    letter-spacing: -0.02em;
  }

  .typer {
    margin-top: 22px;
    font-size: 24px;
    line-height: 1.2;
    font-weight: 700;
    letter-spacing: -0.02em;
    white-space: nowrap;
    min-height: 1.2em;
  }
  .typer .word { color: var(--green); }
  .caret {
    display: inline-block;
    width: 0.5em;
    height: 1em;
    margin-left: 2px;
    vertical-align: -0.14em;
    background: var(--green);
  }
  .caret.blink { animation: blink 1.06s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .cta { margin-top: 32px; display: grid; gap: 10px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    height: 54px; border-radius: 14px;
    font: 600 16px/1 Inter, sans-serif; letter-spacing: -0.005em;
    text-decoration: none; color: var(--paper);
    background: var(--surface);
    border: 1px solid var(--rule);
    transition: background-color .16s cubic-bezier(.25,1,.5,1), transform .12s cubic-bezier(.25,1,.5,1);
  }
  .btn svg { width: 20px; height: 20px; flex: none; }
  .btn:hover { background: var(--plate); }
  .btn:active { transform: scale(.985); }
  .btn.primary { background: var(--paper); color: var(--forest); border-color: var(--paper); font-weight: 700; }
  .btn.primary:hover { background: #fff; }
  .note { margin-top: 12px; text-align: center; font-size: 13px; color: var(--muted); }

  /* The library: real KiCad boards from boardrepo.com, on a slow conveyor */
  .library { margin-top: 44px; padding-bottom: 40px; }
  .library-label {
    font-family: "Plex Mono", monospace; font-weight: 500;
    font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--green); margin-bottom: 14px;
  }
  .rail { overflow: hidden; -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); }
  .track { display: flex; gap: 12px; width: max-content; animation: conveyor 70s linear infinite; }
  .rail:hover .track { animation-play-state: paused; }
  @keyframes conveyor { to { transform: translateX(-50%); } }
  .tile {
    width: 212px; flex: none;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 16px;
    padding: 12px 12px 10px;
  }
  .tile .art { height: 118px; display: grid; place-items: center; }
  .tile img { max-width: 100%; max-height: 118px; object-fit: contain; display: block; filter: drop-shadow(0 8px 14px rgba(0,0,0,.45)); }
  .tile .name {
    margin-top: 10px;
    font-family: "Plex Mono", monospace; font-weight: 500; font-size: 11.5px;
    color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tile .name em { font-style: normal; color: var(--paper); }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (min-width: 900px) {
    main { padding-top: 88px; }
    .wrap { max-width: 640px; }
    h1 { font-size: 92px; }
    .sub { font-size: 21px; }
    .typer { font-size: 28px; }
    .library { margin-top: 72px; }
    .tile { width: 232px; }
    .tile .art { height: 148px; }
    .tile img { max-height: 148px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .track { animation: none; }
    .caret.blink { animation: none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="brand" href="https://boardrepo.com/?ref=hugh" aria-label="BoardRepo">
        <img src="boardrepo-mark.svg" alt=""><span>BoardRepo</span>
      </a>
    </header>

    <main>
      <h1>GitHub for Electronics</h1>
      <p class="sub">Sign up to access <b data-public-boards>9,697</b> open&#8209;source PCB designs.</p>

      <p class="typer" aria-hidden="true">Design with <span class="word" id="word">references</span><span class="caret" id="caret"></span></p>
      <p class="sr">Design with references, confidence, speed, a team and a change log.</p>

      <div class="cta">
        <a class="btn primary" href="https://boardrepo.com/auth/github/start?ref=hugh">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.52-1.33-1.28-1.69-1.28-1.69-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.41-2.69 5.38-5.26 5.67.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5Z"/></svg>
          Continue with GitHub
        </a>
        <a class="btn" href="https://boardrepo.com/auth/google/start?ref=hugh">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#EA4335" d="M12 10.2v3.9h5.4c-.24 1.4-1.66 4.1-5.4 4.1a6.2 6.2 0 0 1 0-12.4c1.9 0 3.18.8 3.9 1.5l2.66-2.56A9.6 9.6 0 0 0 12 2.2a9.8 9.8 0 1 0 0 19.6c5.66 0 9.4-3.98 9.4-9.58 0-.64-.07-1.13-.16-1.62H12Z"/></svg>
          Continue with Google
        </a>
        <a class="btn" href="https://boardrepo.com/signin?ref=hugh">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg>
          Continue with email
        </a>
      </div>
      <p class="note">New here? Signing in creates your account.</p>
    </main>
  </div>

  <section class="library" aria-label="Boards in the library">
    <div class="wrap"><p class="library-label">In the library</p></div>
    <div class="rail"><div class="track" id="track"></div></div>
  </section>

<script>
  // Real public boards on boardrepo.com: [owner, slug, render file id]. The ids are the
  // board render files the boardrepo.com home page already uses (/api/files/<id>?view=1).
  const BOARDS = [
    ["greatscottgadgets", "hackrf", "50e81e7b-61c3-4a12-ad8c-9a1a09e624de"],
    ["torvalds", "guitarpedal", "c68b704d-ecc4-4975-a016-853c841eb95f"],
    ["glasgowembedded", "glasgow", "5fbb9d3f-d6d4-46a5-abee-7b65da8efed3"],
    ["scottbez1", "smartknob", "2e71f7dd-616c-4c1e-8d32-43ac2b6e5cb4"],
    ["joeycastillo", "the-open-book", "a6cf5269-9790-4d00-9c2a-c394d7bc8075"],
    ["hrvach", "deskhop", "5a5e75ec-a4a1-410a-a279-ebe40d4f58c5"],
    ["usbarmory", "usbarmory", "c68e90ae-213c-4e0a-abaa-ca1702020462"],
    ["foostan", "crkbd", "cec2e15d-a152-43de-b79f-31f605e48c6d"],
    ["stack-chan", "stack-chan", "54b6cfbb-02aa-4ecd-873c-ecc8af709925"],
    ["system76", "launch", "b781875e-4aa6-4fc6-bd81-d9e16a360995"],
    ["modos-labs", "glider", "4b0f022c-31fe-43b1-9e3a-e766726b52ee"],
    ["rbaron", "b-parasite", "60386ebe-39dc-4ff6-90d4-650cb7e38231"],
    ["scottbez1-2", "splitflap", "6ee87dd7-8e7c-4a99-a675-1f2e6a5aeae2"],
    ["conorpp", "u2f-zero", "a65a5b61-67cd-4a9f-8414-c4a32ffcc8e4"],
  ];
  const FILES = "https://boardrepo.com/api/files/";   // on boardrepo.com itself this can be "/api/files/"
  const track = document.getElementById("track");
  const tile = ([owner, slug, id]) =>
    `<div class="tile"><div class="art"><img src="${FILES}${id}?view=1" alt="${slug} by ${owner}" loading="lazy" decoding="async"></div>` +
    `<div class="name">${owner}/<em>${slug}</em></div></div>`;
  // Two copies so the conveyor loops without a seam.
  track.innerHTML = BOARDS.map(tile).join("") + BOARDS.map(tile).join("").replaceAll('alt="', 'aria-hidden="true" alt="');

  // "Design with ___": each word types on, holds, then backspaces to the next.
  const WORDS = ["references", "confidence", "speed", "a team", "a change log"];
  const word = document.getElementById("word");
  const caret = document.getElementById("caret");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const wait = ms => new Promise(r => setTimeout(r, ms));

  async function run() {
    let i = 0;
    if (reduce) {            // hard switch, no typing
      for (;;) { await wait(2200); i = (i + 1) % WORDS.length; word.textContent = WORDS[i]; }
    }
    await wait(1400);        // first word is on the page from load: read it, then begin
    for (;;) {
      caret.classList.remove("blink");
      for (let n = word.textContent.length; n > 0; n--) {   // backspace: quick, even
        word.textContent = word.textContent.slice(0, n - 1);
        await wait(28);
      }
      await wait(180);
      i = (i + 1) % WORDS.length;
      const w = WORDS[i];
      for (let n = 1; n <= w.length; n++) {                 // type: human rhythm, a beat after spaces
        word.textContent = w.slice(0, n);
        await wait(w[n - 1] === " " ? 110 : 52 + Math.random() * 34);
      }
      caret.classList.add("blink");
      await wait(1700);                                     // hold long enough to read
    }
  }
  caret.classList.add("blink");
  run();
</script>
</body>
</html>
